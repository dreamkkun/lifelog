# 저녁 미입력 알림 발송 스케줄러. Vercel 무료 플랜의 Cron 은 하루 1번이라, 15분마다 발송 주소를 호출한다.
# 저장소 Settings → Secrets and variables → Actions 에 아래 두 값을 넣어야 동작한다.
#   APP_URL      배포 주소 (예: https://lifelog-in.vercel.app, 끝에 / 없이)
#   CRON_SECRET  Vercel 환경 변수 CRON_SECRET 과 같은 값
name: evening-push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 발송 주소 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET 시크릿이 없어요"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/push/send"
